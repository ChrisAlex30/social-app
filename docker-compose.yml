services:
  mongo:
    image: mongo:7
    container_name: mongo-local
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis/redis-stack:latest
    container_name: redis-stack
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-data:/data

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq
      IDENTITY_SERVICE_URL: http://identity-service:3000
      POST_SERVICE_URL: http://post-service:3000
      MEDIA_SERVICE_URL: http://media-service:3000
      SEARCH_SERVICE_URL: http://search-service:3000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: JWT_SECRET
      NODE_ENV: dev
    depends_on:
      - rabbitmq
      - redis
      - identity-service
      - post-service
      - media-service
      - search-service

  identity-service:
    build: ./identity-service
    container_name: identity-service
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URL: mongodb://mongo:27017/mydb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: JWT_SECRET
      NODE_ENV: dev
    depends_on:
      - mongo
      - redis

  post-service:
    build: ./post-service
    container_name: post-service
    restart: unless-stopped
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq
      MONGODB_URL: mongodb://mongo:27017/mydb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: JWT_SECRET
      NODE_ENV: dev
    depends_on:
      - mongo
      - redis
      - rabbitmq

  media-service:
    build: ./media-service
    container_name: media-service
    restart: unless-stopped
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq
      MONGODB_URL: mongodb://mongo:27017/mydb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: JWT_SECRET
      NODE_ENV: dev
      CLOUDINARY_CLOUD_NAME: ******
      CLOUDINARY_API_KEY: *******
      CLOUDINARY_API_SECRET: ******
    depends_on:
      - mongo
      - redis
      - rabbitmq

  search-service:
    build: ./search-service
    container_name: search-service
    restart: unless-stopped
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://rabbitmq
      MONGODB_URL: mongodb://mongo:27017/mydb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: JWT_SECRET
      NODE_ENV: dev
    depends_on:
      - mongo
      - redis
      - rabbitmq

volumes:
  mongo-data:
  redis-data:
  rabbitmq-data: